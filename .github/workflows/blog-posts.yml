name: Latest Blog Posts

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Pull in aerobytes.io blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://aerobytes.io/feed.xml,https://medium.com/feed/@aeronique"
          max_post_count: 5
          template: "- [$title]($url) - $description"
          commit_message: "Updated with latest blog posts"
          committer_username: "blog-updater-bot"
          committer_email: "bot@aerobytes.io"
